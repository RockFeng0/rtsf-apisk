[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apisk"
version = "3.0.0"
description = "A pytest-based API automation framework where endpoints, services and readiness probes are declared by pluggable domain packages"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "RockFeng0", email = "281589463@qq.com" },
]
keywords = ["pytest", "api-testing", "test-automation", "pytest-plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pytest>=8.0",
    "pytest-html>=4.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest-cov>=4.0"]

[project.urls]
Homepage = "https://github.com/RockFeng0/apisk"
Repository = "https://github.com/RockFeng0/rtsf-apisk"
Issues = "https://github.com/RockFeng0/rtsf-apisk/issues"
Changelog = "https://github.com/RockFeng0/rtsf-apisk/blob/main/CHANGELOG.md"

# pytest 插件自动注册：pip install 后 pytest 启动时自动加载本模块的钩子
[project.entry-points."pytest11"]
apisk = "apisk.pytest_plugin"

# 骨架生成命令
[project.scripts]
apisk-scaffold = "apisk.scaffold:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"apisk.docs" = ["**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
